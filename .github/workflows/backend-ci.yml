# CI del backend (preparado como archivo; NO activado: el repositorio no se ha publicado).
name: backend-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: blinka
          POSTGRES_PASSWORD: blinka_ci_only
          POSTGRES_DB: blinka_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blinka -d blinka_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      LOG_FORMAT: json
      # Base efímera del job de CI (local al runner), nunca un destino compartido.
      DATABASE_URL: postgres://blinka:blinka_ci_only@localhost:5432/blinka_test
      TEST_DATABASE_URL: postgres://blinka:blinka_ci_only@localhost:5432/blinka_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:migrate:test
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
